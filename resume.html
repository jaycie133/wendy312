<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>粘雅茵 Wendy | 時尚履歷設計</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --melon-green: #D3F2D3; /* 主色：哈密瓜綠 */
            --soft-yellow: #FFF9C4; /* 次色：淡黃色 */
            --dark-olive: #4A5D4A;  /* 文字深色 */
            --white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans TC', sans-serif;
        }

        body {
            background-color: #F7FBF7;
            color: var(--dark-olive);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--white);
            display: grid;
            grid-template-columns: 1fr 2fr;
            box-shadow: 20px 20px 0px var(--melon-green);
            border: 1px solid var(--melon-green);
        }

        /* 左側欄目 */
        .sidebar {
            background-color: var(--melon-green);
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

            .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid var(--white);
            margin-bottom: 20px;
        }

        .sidebar h1 {
            font-size: 24px;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .sidebar h2 {
            font-size: 16px;
            font-weight: 300;
            margin-bottom: 30px;
            color: #668866;
        }

        .info-box {
            width: 100%;
            background: var(--white);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .info-item {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .info-item i {
            margin-right: 10px;
            color: #88B288;
        }

        /* 右側欄目 */
        .main-content {
            padding: 50px;
            background-color: var(--white);
        }

        section {
            margin-bottom: 40px;
        }

        .section-title {
            display: inline-block;
            font-size: 20px;
            font-weight: 700;
            padding: 0 10px;
            background: linear-gradient(transparent 60%, var(--soft-yellow) 0);
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .about-text {
            font-size: 15px;
            text-align: justify;
        }

        .experience-item {
            margin-bottom: 20px;
            border-left: 2px solid var(--soft-yellow);
            padding-left: 20px;
        }

        .experience-item h3 {
            font-size: 17px;
            margin-bottom: 5px;
        }

        .experience-item span {
            font-size: 13px;
            color: #999;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .skill-tag {
            background: var(--soft-yellow);
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 14px;
            text-align: center;
        }
